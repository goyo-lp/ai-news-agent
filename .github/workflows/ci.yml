name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install uv
        run: python -m pip install uv==0.10.7
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Sanity check (no secrets, valid repo)
        run: |
          python --version
          git ls-files | head -n 20
          # Fail if a .env file was accidentally committed
          if git ls-files | grep -q '^\.env$'; then
            echo ".env file committed — remove it" >&2
            exit 1
          fi
      - name: Lint and format
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Test
        env:
          LANGSMITH_TRACING: "false"
        run: uv run pytest
      - name: Build package
        run: uv build
