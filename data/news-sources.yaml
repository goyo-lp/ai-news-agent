fetch_defaults:
  image_fallback_rss_enclosure: true
  requires_user_agent: true
  blocked_domains: []

sources:
  # --- Digests / aggregators ---
  - name: "TLDR AI"
    url: "https://tldr.tech/ai"
    rss: "https://tldr.tech/api/rss/ai"

  # --- Tech press (AI sections) ---
  - name: "TechCrunch (AI)"
    url: "https://techcrunch.com/category/artificial-intelligence/"
    rss: "https://techcrunch.com/category/artificial-intelligence/feed/"

  - name: "The Verge (AI)"
    url: "https://www.theverge.com/ai-artificial-intelligence"
    rss: "https://www.theverge.com/rss/ai-artificial-intelligence/index.xml"

  - name: "Wired (AI)"
    url: "https://www.wired.com/tag/artificial-intelligence/"
    rss: "https://www.wired.com/feed/tag/ai/latest/rss"

  - name: "MIT Technology Review"
    url: "https://www.technologyreview.com/topic/artificial-intelligence/"
    rss: "https://www.technologyreview.com/topic/artificial-intelligence/feed/"

  - name: "VentureBeat (AI)"
    url: "https://venturebeat.com/category/ai/"
    rss: "https://venturebeat.com/feed/"

  - name: "ZDNet (AI)"
    url: "https://www.zdnet.com/topic/artificial-intelligence/"
    rss: "https://www.zdnet.com/topic/artificial-intelligence/rss.xml"

  - name: "The Guardian (AI)"
    url: "https://www.theguardian.com/technology/artificialintelligenceai"
    rss: "https://www.theguardian.com/technology/artificialintelligenceai/rss"

  - name: "Ars Technica (AI)"
    url: "https://arstechnica.com/ai/"
    rss: "https://arstechnica.com/ai/feed/"

  - name: "AI News"
    url: "https://www.artificialintelligence-news.com/"
    rss: "https://www.artificialintelligence-news.com/feed/"

  - name: "InfoQ (AI/ML)"
    url: "https://www.infoq.com/ai-ml-data-eng/"
    rss: "https://feed.infoq.com/ai-ml-data-eng"

  # --- Company / lab blogs ---
  - name: "OpenAI Blog"
    url: "https://openai.com/news/"
    rss: "https://openai.com/news/rss.xml"

  - name: "Google DeepMind Blog"
    url: "https://deepmind.google/discover/blog/"
    rss: "https://deepmind.google/blog/rss.xml"

  - name: "Google AI Blog"
    url: "https://blog.google/technology/ai/"
    rss: "https://blog.google/technology/ai/rss/"

  - name: "NVIDIA Blog (AI)"
    url: "https://blogs.nvidia.com/blog/category/ai/"
    rss: "https://blogs.nvidia.com/feed/"

  - name: "AWS Machine Learning Blog"
    url: "https://aws.amazon.com/blogs/machine-learning/"
    rss: "https://aws.amazon.com/blogs/machine-learning/feed/"

  - name: "Apple Machine Learning Journal"
    url: "https://machinelearning.apple.com/"
    rss: "https://machinelearning.apple.com/rss.xml"

  - name: "Hugging Face (Blog)"
    url: "https://huggingface.co/blog"
    rss: "https://huggingface.co/blog/feed.xml"

  # --- Research ---
  - name: "arXiv.org (cs.AI)"
    url: "https://arxiv.org/list/cs.AI/recent"
    rss: "http://export.arxiv.org/rss/cs.AI"
    fetch_overrides:
      blocked_domains:
        - "arxiv.org"

  - name: "BAIR Blog (Berkeley)"
    url: "https://bair.berkeley.edu/blog/"
    rss: "https://bair.berkeley.edu/blog/feed.xml"

  - name: "MIT News (AI)"
    url: "https://news.mit.edu/topic/artificial-intelligence2"
    rss: "https://news.mit.edu/rss/topic/artificial-intelligence2"

  # --- Community / trending signal ---
  - name: "Hacker News (Top)"
    url: "https://news.ycombinator.com/"
    rss: "https://hnrss.org/frontpage?points=100"
    fetch_overrides:
      blocked_domains:
        - "news.ycombinator.com"

  - name: "GitHub Trending"
    url: "https://github.com/trending"
    rss: "https://mshibanami.github.io/GitHubTrendingRSS/daily/all.xml"
    assume_published_now: true

  - name: "Simon Willison"
    url: "https://simonwillison.net/"
    rss: "https://simonwillison.net/atom/everything/"

  - name: "Reddit r/MachineLearning"
    url: "https://www.reddit.com/r/MachineLearning/"
    rss: "https://www.reddit.com/r/MachineLearning/.rss"
    fetch_overrides:
      requires_user_agent: true

  - name: "Reddit r/artificial"
    url: "https://www.reddit.com/r/artificial/"
    rss: "https://www.reddit.com/r/artificial/.rss"
    fetch_overrides:
      requires_user_agent: true
